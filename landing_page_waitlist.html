<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedTriage — Waitlist</title>
</head>

<body style="margin:0;">
<div style="padding:10px;">
    <div style="
        position:relative;
        overflow:hidden;
        width:100%;
        min-height:96vh;
        border-radius:3%;
        background:linear-gradient(
            180deg,
            #5FA9E8 0%,
            #7CBCEF 55%,
            #A7D2F5 100%
        );
    ">
        <!-- Left Glow -->
        <div style="
            position:absolute;
            width:900px;
            height:900px;
            left:-350px;
            top:50%;
            transform:translateY(-50%);
            background:white;
            border-radius:50%;
            filter:blur(220px);
            opacity:.22;
            pointer-events:none;
        "></div>

        <!-- Center Glow -->
        <div style="
            position:absolute;
            width:700px;
            height:700px;
            left:50%;
            top:45%;
            transform:translate(-50%,-50%);
            background:white;
            border-radius:50%;
            filter:blur(180px);
            opacity:.12;
            pointer-events:none;
        "></div>

        <!-- Right Glow -->
        <div style="
            position:absolute;
            width:900px;
            height:900px;
            right:-350px;
            top:50%;
            transform:translateY(-50%);
            background:white;
            border-radius:50%;
            filter:blur(220px);
            opacity:.22;
            pointer-events:none;
        "></div>

        <div style="position:relative; z-index:1;">
            <div style="display:flex; flex-direction:row; justify-content:space-between; padding-top:20px; padding-left:50px; padding-right:50px;">
                <div>MedTriage</div>
                <div>Button</div>
            </div>
            <br>
            <br>
            <div style="display:flex; justify-content:center;">
                <div style="border-radius:9999px; background-color:#d3d6d6; display:inline-block;">
                    <div style="padding:10px;">Coming Soon</div>
                </div>
            </div>
            <br>
            <div style="text-align:center; font-size:110px;">TRIAGE. FASTER.</div>
            <br>
            <div style="text-align:center;">Next-generation clinical intelligence for critical care environments.</div>
            <br>
            <div style="display:flex; justify-content:center;">
                <div style="display:flex; justify-content:space-between; align-items:center; width:450px; background:#d3d6d6; border-radius:9999px; padding:10px 12px;">
                    <div style="font-size:14px;">
                        Your email address
                    </div>

                    <div style="background:white; padding:10px 25px; border-radius:9999px; font-size:12px; cursor:pointer;">
                        JOIN WAITLIST
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
